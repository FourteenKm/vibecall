<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeCall — 视频通话 · 自动总结</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='4'%20fill='%233b82f6'/%3E%3Ccircle%20cx='8'%20cy='8'%20r='3'%20fill='white'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(160deg,#0f172a 0%,#1e293b 60%,#172554 100%);
    color:#e2e8f0; -webkit-font-smoothing:antialiased;
  }
  .hidden { display:none !important; }
  .screen { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card {
    width:420px; max-width:100%; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:28px;
    backdrop-filter:blur(8px);
  }
  h1 { font-size:26px; font-weight:700; letter-spacing:.02em; }
  h2 { font-size:20px; font-weight:700; margin-bottom:8px; }
  h3 { font-size:14px; font-weight:600; margin:18px 0 8px; color:#93c5fd; }
  .sub { color:#94a3b8; font-size:13px; margin:6px 0 20px; }
  label { font-size:12px; color:#94a3b8; display:block; margin-bottom:6px; }
  input, textarea {
    width:100%; background:rgba(15,23,42,.6); border:1px solid rgba(255,255,255,.15);
    border-radius:10px; color:#e2e8f0; padding:10px 12px; font-size:14px; outline:none;
    font-family:inherit;
  }
  input:focus, textarea:focus { border-color:#60a5fa; }
  textarea { resize:vertical; line-height:1.6; }
  .row { display:flex; gap:10px; margin-top:12px; }
  button {
    border:none; border-radius:10px; padding:10px 16px; font-size:14px; cursor:pointer;
    font-family:inherit; font-weight:600;
  }
  .primary { background:#3b82f6; color:#fff; flex:1; }
  .primary:hover { background:#2563eb; }
  .secondary { background:rgba(255,255,255,.1); color:#e2e8f0; }
  .mini { background:rgba(255,255,255,.1); color:#cbd5e1; font-size:12px; font-weight:500; padding:6px 10px; }
  .divider { display:flex; align-items:center; gap:10px; color:#64748b; font-size:12px; margin:18px 0 4px; }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.1); }
  .msg { min-height:18px; font-size:12px; margin-top:10px; color:#fbbf24; }
  .tip { font-size:11px; color:#64748b; margin-top:14px; line-height:1.6; }

  /* ---- call screen ---- */
  #call { flex-direction:column; align-items:stretch; justify-content:flex-start; gap:14px; }
  .topline { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#94a3b8; }
  .topline b { color:#e2e8f0; letter-spacing:.15em; }
  .rec { display:flex; align-items:center; gap:6px; color:#f87171; }
  .rec i { width:8px; height:8px; border-radius:4px; background:#ef4444; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .grid { flex:1; display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); align-content:start; }
  .tile { position:relative; border-radius:14px; overflow:hidden; background:#0b1220; aspect-ratio:16/9; border:1px solid rgba(255,255,255,.08); }
  .tile video { width:100%; height:100%; object-fit:cover; }
  .tile .tag { position:absolute; left:10px; bottom:8px; font-size:12px; background:rgba(0,0,0,.5); padding:3px 8px; border-radius:6px; }
  .tile .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px; color:#475569; }
  .controls { display:flex; justify-content:center; gap:14px; padding:6px 0 2px; }
  .ctl { width:52px; height:52px; border-radius:26px; background:rgba(255,255,255,.12); color:#e2e8f0; display:flex; align-items:center; justify-content:center; }
  .ctl.off { background:#f59e0b; color:#111; }
  .ctl.danger { width:auto; padding:0 22px; gap:8px; background:#ef4444; color:#fff; display:flex; }

  /* ---- post screen ---- */
  .post-card { width:640px; }
  .summary { background:rgba(15,23,42,.6); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:14px 16px; font-size:13px; line-height:1.8; white-space:pre-wrap; }
  .summary b { color:#93c5fd; }
</style>
</head>
<body>

<!-- ============ 大厅 ============ -->
<div id="lobby" class="screen">
  <div class="card">
    <h1>VibeCall</h1>
    <p class="sub">多人视频通话 · 挂断后自动转写并生成总结</p>
    <label>你的昵称</label>
    <input id="nameInput" maxlength="12" placeholder="例如：小李">
    <div class="row"><button id="createBtn" class="primary">创建通话</button></div>
    <div class="divider">或</div>
    <div class="row">
      <input id="codeInput" placeholder="输入通话码（如 AB12CD）" style="text-transform:uppercase">
      <button id="joinBtn" class="secondary">加入</button>
    </div>
    <div id="lastWrap" class="hidden">
      <div class="divider">上次通话</div>
      <div class="row">
        <button id="rejoinBtn" class="secondary hidden"></button>
        <button id="viewLastBtn" class="mini hidden">查看上次的转写与总结</button>
      </div>
    </div>
    <p id="lobbyMsg" class="msg"></p>
    <p class="tip">摄像头非必需：不允许摄像头时会以纯语音/观看模式加入。通话为 P2P 直连，录音与转写全部在浏览器本地完成。请确保所有参与者知晓并同意录音。</p>
  </div>
</div>

<!-- ============ 通话 ============ -->
<div id="call" class="screen hidden">
  <div class="topline">
    <span>通话码 <b id="roomCode"></b>&nbsp; <button id="copyBtn" class="mini">复制邀请链接</button></span>
    <span class="rec"><i></i>本地录音中</span>
  </div>
  <p id="callHint" class="tip" style="text-align:center; margin-top:0;"></p>
  <div id="grid" class="grid"></div>
  <div class="controls">
    <button id="micBtn" class="ctl" title="麦克风">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
    </button>
    <button id="camBtn" class="ctl" title="摄像头">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
    <button id="leaveBtn" class="ctl danger">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41.6 1 1 0 0 1 .95 1v3.1a1 1 0 0 1-1.09 1 19 19 0 0 1-8.35-3.05 1 1 0 0 1-.28-1.45l2-2.6a1 1 0 0 1 1.34-.25l2.02 1.65z"/><path d="M21.65 7.65a1 1 0 0 1-.25 1.34l-2.6 2a1 1 0 0 1-1.45-.28 19 19 0 0 0-3.05-8.35 1 1 0 0 0-1.45-.28l-2 2a19 19 0 0 1 7.7 3.57z" transform="rotate(90 12 12)"/></svg>
      挂断并总结
    </button>
  </div>
</div>

<!-- ============ 结束页 ============ -->
<div id="post" class="screen hidden">
  <div class="card post-card">
    <h2>通话已结束</h2>
    <p id="recInfo" class="sub"></p>
    <div class="row" style="margin-top:0;">
      <button id="downloadRec" class="secondary">下载录音</button>
      <button id="transcribeBtn" class="primary">开始转写</button>
    </div>
    <p id="asrProgress" class="msg"></p>

    <div id="transcriptWrap" class="hidden">
      <h3>转写文本（可编辑后再总结）</h3>
      <textarea id="transcript" rows="8"></textarea>
      <div class="row">
        <button id="summaryBtn" class="primary">生成总结</button>
        <button id="llmToggle" class="mini">用云端大模型增强（可选）</button>
      </div>
      <div id="llmPanel" class="hidden" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
        <input id="llmBase" placeholder="API 地址（OpenAI 兼容），如 https://dashscope.aliyuncs.com/compatible-mode/v1">
        <input id="llmKey" type="password" placeholder="API Key">
        <input id="llmModel" placeholder="模型名，如 qwen-plus">
      </div>
    </div>

    <div id="summaryWrap" class="hidden">
      <h3>自动总结</h3>
      <div id="summary" class="summary"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 全局状态 ================= */
var peer = null, dataConn = null, localStream = null;
var isHost = false, roomCode = '', myName = '匿名';
var roster = [], calledIds = {}, tiles = {};
var recorder = null, recChunks = [], recStart = 0, recBlob = null, recUrl = null;
var audioCtx = null, mixDest = null;
var asrWorker = null;
var mediaWarn = '';

var $ = function (id) { return document.getElementById(id); };
function show(id) { ['lobby','call','post'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); }); }
function msg(t) { $('lobbyMsg').textContent = t; }

var PEER_OPTS = {
  debug: 1,
  config: { iceServers: [
    { urls: ['stun:stun.miwifi.com:3478', 'stun:stun.chat.bilibili.com:3478', 'stun:stun.hdslb.com:3478'] },
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'],
      username: 'openrelayproject', credential: 'orrcterX' }
  ] }
};
var HOST_PREFIX = 'vibecall-demo-';

function genCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
  for (var i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

/* ================= 入会流程 ================= */
async function startMedia() {
  var warn = '';
  try { localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); }
  catch (e1) {
    try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); warn = '摄像头不可用或未被允许，已用纯语音加入。'; }
    catch (e2) {
      try { localStream = await navigator.mediaDevices.getUserMedia({ video: true }); warn = '麦克风不可用或未被允许，对方将听不到你的声音。'; }
      catch (e3) { localStream = new MediaStream(); warn = '摄像头和麦克风都不可用，已用观看模式加入。'; }
    }
  }
  mediaWarn = warn;
  // 混音录音：本地麦克风 + 所有远端音频
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  mixDest = audioCtx.createMediaStreamDestination();
  if (localStream.getAudioTracks().length) audioCtx.createMediaStreamSource(localStream).connect(mixDest);
  recChunks = [];
  recorder = new MediaRecorder(mixDest.stream, { mimeType: pickMime() });
  recorder.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.start(1000);
  recStart = Date.now();
}
function pickMime() {
  var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
  for (var i = 0; i < c.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])) return c[i];
  return '';
}

$('createBtn').onclick = async function () {
  myName = $('nameInput').value.trim() || '房主';
  if (!window.isSecureContext) { msg('当前不是 HTTPS/localhost 环境，浏览器会禁止摄像头。请用 node server.js 本地运行或部署到 HTTPS。'); return; }
  try { await startMedia(); } catch (e) { msg('无法访问摄像头/麦克风：' + e.message); return; }
  roomCode = genCode();
  isHost = true;
  lsSet('vc.name', myName); lsSet('vc.lastRoom', roomCode);
  initPeer(HOST_PREFIX + roomCode.toLowerCase());
};

$('joinBtn').onclick = async function () {
  myName = $('nameInput').value.trim() || '朋友';
  var code = $('codeInput').value.trim().toUpperCase();
  if (code.length < 4) { msg('请输入通话码'); return; }
  if (!window.isSecureContext) { msg('当前不是 HTTPS/localhost 环境，浏览器会禁止摄像头。'); return; }
  try { await startMedia(); } catch (e) { msg('无法访问摄像头/麦克风：' + e.message); return; }
  roomCode = code;
  isHost = false;
  lsSet('vc.name', myName); lsSet('vc.lastRoom', roomCode);
  initPeer(undefined);
};

function initPeer(id) {
  peer = new Peer(id, PEER_OPTS);
  peer.on('open', function () {
    if (isHost) { enterCall(); }
    else {
      dataConn = peer.connect(HOST_PREFIX + roomCode.toLowerCase(), { reliable: true, metadata: { name: myName } });
      msg('正在连接房间…');
      var connTimer = setTimeout(function () {
        cleanupToLobby('连接房间超时：请核对通话码，并确认房主页面保持打开；双方刷新重试。');
      }, 12000);
      dataConn.on('open', function () {
        clearTimeout(connTimer); msg('');
        dataConn.send({ type: 'hello', name: myName }); enterCall();
      });
      dataConn.on('data', onHostData);
      dataConn.on('error', function () { clearTimeout(connTimer); cleanupToLobby('与房间的连接出错，请重新加入。'); });
      dataConn.on('close', function () { clearTimeout(connTimer); cleanupToLobby('房主已离开，通话结束。'); });
    }
  });
  peer.on('call', function (call) {
    call.answer(localStream);
    wireCall(call);
  });
  peer.on('connection', function (conn) {           // 仅房主
    conn.on('data', function (d) {
      if (d && d.type === 'hello') {
        roster.push({ id: conn.peer, name: d.name });
        broadcastRoster();
      }
    });
    conn.on('close', function () {
      roster = roster.filter(function (m) { return m.id !== conn.peer; });
      removeTile(conn.peer);
      broadcastRoster();
    });
  });
  peer.on('error', function (err) {
    var t = err && err.type;
    if (t === 'peer-unavailable') { cleanupToLobby('通话不存在或已结束，请核对通话码。'); }
    else if (t === 'unavailable-id') { cleanupToLobby('房间冲突，请重新创建。'); }
    else if (t === 'network' || t === 'server-error') { cleanupToLobby('信令服务连接失败，请检查网络后重试。'); }
    else console.warn('peer error', err);
  });
  peer.on('disconnected', function () { if (peer && !peer.destroyed) peer.reconnect(); });
}

function broadcastRoster() {
  if (!isHost || !peer) return;
  var list = [{ id: peer.id, name: myName }].concat(roster);
  peer.listConnections && Object.keys(peer.connections || {}).forEach(function (pid) {
    (peer.connections[pid] || []).forEach(function (c) { if (c.open) c.send({ type: 'roster', members: list }); });
  });
}
function onHostData(d) {
  if (!d) return;
  if (d.type === 'roster') {
    (d.members || []).forEach(function (m) {
      if (m.id !== peer.id && !calledIds[m.id]) { calledIds[m.id] = true; placeCall(m.id, m.name); }
    });
  } else if (d.type === 'leave') { removeTile(d.id); }
}
function placeCall(id, name) {
  var call = peer.call(id, localStream, { metadata: { name: myName } });
  if (call) wireCall(call);
}
function wireCall(call) {
  var t = setTimeout(function () {
    $('callHint').textContent = '长时间没出现对方画面？让朋友刷新页面重新加码，或双方换网络（如手机流量）重试。';
  }, 15000);
  call.on('stream', function (remote) {
    clearTimeout(t); if (!mediaWarn) $('callHint').textContent = hintDefault;
    addTile(call.peer, (call.metadata && call.metadata.name) || '朋友', remote);
  });
  call.on('close', function () { removeTile(call.peer); });
  try {
    var pc = call.peerConnection;
    if (pc) pc.addEventListener('iceconnectionstatechange', function () {
      var st = pc.iceConnectionState;
      if (st === 'failed' || st === 'disconnected' || st === 'closed') {
        $('callHint').textContent = '与对方的音视频通道建立失败或已中断（多为网络 NAT/防火墙限制）。双方刷新页面重试，或换用手机流量。';
      }
    });
  } catch (e) {}
}

/* ================= 通话界面 ================= */
var hintDefault = '把邀请链接或通话码发给朋友，对方打开后输入码加入，画面会自动出现。';
function enterCall() {
  $('roomCode').textContent = roomCode;
  $('callHint').textContent = mediaWarn || hintDefault;
  if (localStream && !localStream.getVideoTracks().length) $('camBtn').classList.add('off');
  if (localStream && !localStream.getAudioTracks().length) $('micBtn').classList.add('off');
  try { history.replaceState(null, '', '#' + roomCode); } catch (e) {}
  show('call');
  addTile('me', myName + '（我）', localStream, true);
}
function addTile(id, name, stream, isLocal) {
  if (tiles[id]) { tiles[id].video.srcObject = stream; return; }
  var tile = document.createElement('div'); tile.className = 'tile';
  var v = document.createElement('video');
  v.autoplay = true; v.playsInline = true; v.srcObject = stream;
  if (isLocal) { v.muted = true; v.style.transform = 'scaleX(-1)'; }
  if (!stream.getVideoTracks || !stream.getVideoTracks().length) {
    var ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = (name || '?').charAt(0);
    tile.appendChild(ph);
  }
  var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = name;
  tile.appendChild(v); tile.appendChild(tag);
  $('grid').appendChild(tile);
  tiles[id] = { el: tile, video: v };
  if (!isLocal && audioCtx && stream.getAudioTracks && stream.getAudioTracks().length) {
    try { audioCtx.createMediaStreamSource(stream).connect(mixDest); } catch (e) {}
  }
}
function removeTile(id) {
  if (tiles[id]) { tiles[id].el.remove(); delete tiles[id]; }
}
function addNote(t) { console.log(t); }
function cleanupToLobby(t) {
  if (localStream) localStream.getTracks().forEach(function (tr) { tr.stop(); });
  if (peer) { try { peer.destroy(); } catch (e) {} }
  peer = null; localStream = null; dataConn = null; calledIds = {}; roster = [];
  Object.keys(tiles).forEach(function (k) { removeTile(k); });
  show('lobby');
  if (t) msg(t);
}
function copyText(text) {
  var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove();
}

$('copyBtn').onclick = function () {
  copyText(location.origin + location.pathname + '#' + roomCode);
  this.textContent = '已复制邀请链接'; var b = this; setTimeout(function () { b.textContent = '复制邀请链接'; }, 1600);
};
$('micBtn').onclick = function () {
  var on = toggleTrack('audio'); this.classList.toggle('off', !on);
};
$('camBtn').onclick = function () {
  var on = toggleTrack('video'); this.classList.toggle('off', !on);
};
function toggleTrack(kind) {
  if (!localStream) return true;
  var tr = localStream.getTracks().filter(function (t) { return t.kind === kind; })[0];
  if (tr) tr.enabled = !tr.enabled;
  return tr ? tr.enabled : true;
}

$('leaveBtn').onclick = function () {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  recorder.onstop = function () {
    recBlob = new Blob(recChunks, { type: recorder.mimeType || 'audio/webm' });
    recUrl = URL.createObjectURL(recBlob);
    openPost();
  };
  if (localStream) localStream.getTracks().forEach(function (t) { t.stop(); });
  if (peer) peer.destroy();
};

/* ================= 结束页：转写 + 总结 ================= */
function openPost() {
  $('downloadRec').classList.remove('hidden');
  $('transcribeBtn').classList.remove('hidden');
  var sec = Math.round((Date.now() - recStart) / 1000);
  var mm = Math.floor(sec / 60), ss = sec % 60;
  $('recInfo').textContent = '本次通话约 ' + mm + ' 分 ' + ss + ' 秒，录音 ' + (recBlob ? (recBlob.size / 1024 / 1024).toFixed(2) : 0) + ' MB（仅存于本地内存）。';
  $('downloadRec').onclick = function () {
    var a = document.createElement('a'); a.href = recUrl; a.download = 'vibecall-' + roomCode + '.webm'; a.click();
  };
  show('post');
}

$('transcribeBtn').onclick = async function () {
  $('asrProgress').textContent = '准备音频…';
  try {
    var buf = await recBlob.arrayBuffer();
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    var audio = await ac.decodeAudioData(buf);
    var pcm = to16k(audio);
    $('asrProgress').textContent = '正在加载 Whisper 模型（首次约 40MB，之后有缓存）…';
    ensureWorker();
    asrWorker.postMessage({ type: 'run', audio: pcm }, [pcm.buffer]);
  } catch (e) {
    $('asrProgress').textContent = '音频解码失败：' + e.message + '。可下载录音后用其他工具转写，再粘贴到文本框总结。';
    $('transcriptWrap').classList.remove('hidden');
  }
};

function to16k(audioBuffer) {
  var n = audioBuffer.numberOfChannels, len = audioBuffer.length;
  var mixed = new Float32Array(len);
  for (var c = 0; c < n; c++) {
    var d = audioBuffer.getChannelData(c);
    for (var i = 0; i < len; i++) mixed[i] += d[i] / n;
  }
  var sr = audioBuffer.sampleRate, ratio = sr / 16000;
  var outLen = Math.floor(len / ratio), out = new Float32Array(outLen);
  for (var j = 0; j < outLen; j++) {
    var p = j * ratio, i0 = Math.floor(p), t = p - i0;
    var a = mixed[i0], b = mixed[Math.min(i0 + 1, len - 1)];
    out[j] = a + (b - a) * t;
  }
  return out;
}

function ensureWorker() {
  if (asrWorker) return;
  var src = [
    "self.importScripts('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js');",
    'var asr=null;',
    'self.onmessage=function(e){',
    '  var d=e.data;',
    '  if(d.type==="run"){',
    '    (async function(){',
    '      try{',
    '        if(!asr){',
    '          asr=await self.transformers.pipeline("automatic-speech-recognition","Xenova/whisper-tiny",{',
    '            quantized:true,',
    '            progress_callback:function(p){ if(p.status==="progress"&&p.total){ self.postMessage({type:"model",p:Math.round(100*p.loaded/p.total)}); } }',
    '          });',
    '          self.postMessage({type:"ready"});',
    '        }',
    '        var out=await asr(d.audio,{chunk_length_s:30,stride_length_s:5,return_timestamps:false});',
    '        self.postMessage({type:"done",text:out.text||""});',
    '      }catch(err){ self.postMessage({type:"error",message:String(err&&err.message||err)}); }',
    '    })();',
    '  }',
    '};'
  ].join('\n');
  asrWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
  asrWorker.onmessage = function (e) {
    var d = e.data;
    if (d.type === 'model') $('asrProgress').textContent = '模型下载中 ' + d.p + '% …';
    else if (d.type === 'ready') $('asrProgress').textContent = '转写中，可能需要几分钟（本地 CPU 运算）…';
    else if (d.type === 'done') {
      $('asrProgress').textContent = '转写完成。';
      $('transcript').value = d.text || '（未识别到语音内容）';
      lsSet('vc.transcript', $('transcript').value); lsSet('vc.savedAt', new Date().toLocaleString());
      $('transcriptWrap').classList.remove('hidden');
    } else if (d.type === 'error') {
      $('asrProgress').textContent = '转写失败：' + d.message + '。你可以手动粘贴转写文本后点“生成总结”。';
      $('transcriptWrap').classList.remove('hidden');
    }
  };
}

$('llmToggle').onclick = function () { $('llmPanel').classList.toggle('hidden'); };

$('summaryBtn').onclick = async function () {
  var text = $('transcript').value.trim();
  if (!text) { $('asrProgress').textContent = '先有转写文本才能总结。'; return; }
  var base = $('llmBase').value.trim(), key = $('llmKey').value.trim(), model = $('llmModel').value.trim();
  var out = '';
  if (base && key && model) {
    $('asrProgress').textContent = '正在调用云端大模型…';
    try {
      var r = await fetch(base.replace(/\/$/, '') + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: '你是通话纪要助手。把视频通话转写整理为：一句话摘要、要点（3-7条）、待办事项（如有）。用 Markdown 输出。' },
            { role: 'user', content: text }
          ]
        })
      });
      var j = await r.json();
      out = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (!out) throw new Error('API 返回格式异常');
    } catch (e) {
      out = '（云端模型调用失败：' + e.message + '，已改用本地算法）\n\n' + localSummary(text);
    }
  } else {
    out = localSummary(text);
  }
  lsSet('vc.transcript', text); lsSet('vc.summary', out); lsSet('vc.savedAt', new Date().toLocaleString());
  $('summary').textContent = out;
  $('summaryWrap').classList.remove('hidden');
};

/* 内置提取式总结（零依赖兜底） */
function localSummary(text) {
  var stop = '的了是我你他她它就在有和也都不而及与或个中这那很太真没还又再才把被让给从到去来上下里外吗啊吧呢哦嗯对好会能要就着很更最'.split('');
  var sentences = text.split(/[。！？!?\n]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length >= 6; });
  var freq = {};
  function tokens(s) {
    var out = [];
    (s.match(/[一-鿿]+/g) || []).forEach(function (r) {
      for (var i = 0; i < r.length; i++) {
        if (stop.indexOf(r[i]) < 0) out.push(r[i]);
        if (i + 1 < r.length) out.push(r[i] + r[i + 1]);
      }
    });
    (s.match(/[A-Za-z0-9]{2,}/g) || []).forEach(function (x) { out.push(x.toLowerCase()); });
    return out;
  }
  sentences.forEach(function (s) { tokens(s).forEach(function (t) { freq[t] = (freq[t] || 0) + 1; }); });
  var kwAll = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; });
  var kw = [];
  kwAll.forEach(function (t) {
    if (kw.length >= 6) return;
    if (t.length < 2) return;
    var dup = kw.some(function (k) { return k.indexOf(t) >= 0 || t.indexOf(k) >= 0; });
    if (!dup) kw.push(t);
  });
  if (kw.length < 3) kwAll.forEach(function (t) { if (kw.length < 3 && t.length === 1 && kw.indexOf(t) < 0) kw.push(t); });
  function score(s) {
    var t = tokens(s);
    if (!t.length) return 0;
    var sum = t.reduce(function (acc, x) { return acc + (freq[x] || 0); }, 0);
    return sum / Math.pow(t.length, 0.6);
  }
  var top = sentences.map(function (s, i) { return { s: s, i: i, sc: score(s) }; })
    .sort(function (a, b) { return b.sc - a.sc; }).slice(0, 4)
    .sort(function (a, b) { return a.i - b.i; });
  var lines = [];
  lines.push('【一句话摘要】本次通话共 ' + sentences.length + ' 句，围绕' + (kw.slice(0, 3).join('、') || '若干话题') + '等话题展开。');
  lines.push('');
  lines.push('【关键内容】');
  top.forEach(function (x) { lines.push('· ' + x.s); });
  if (kw.length) { lines.push(''); lines.push('【关键词】' + kw.join(' / ')); }
  return lines.join('\n');
}

/* ================= 本地状态（刷新/重开不丢） ================= */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function openSaved() {
  recBlob = null;
  $('recInfo').textContent = '这是本浏览器保存的历史记录（' + (lsGet('vc.savedAt') || '时间未知') + '）。';
  $('downloadRec').classList.add('hidden');
  $('transcribeBtn').classList.add('hidden');
  var t = lsGet('vc.transcript');
  if (t) { $('transcript').value = t; $('transcriptWrap').classList.remove('hidden'); }
  var s = lsGet('vc.summary');
  if (s) { $('summary').textContent = s; $('summaryWrap').classList.remove('hidden'); }
  show('post');
}
(function initState() {
  var n = lsGet('vc.name'); if (n) $('nameInput').value = n;
  var h = (location.hash || '').replace('#', '').trim().toUpperCase();
  if (h.length >= 4) $('codeInput').value = h;
  var last = lsGet('vc.lastRoom');
  if (last) {
    $('lastWrap').classList.remove('hidden');
    var rb = $('rejoinBtn'); rb.classList.remove('hidden');
    rb.textContent = '重新加入 ' + last;
    rb.onclick = function () { $('codeInput').value = last; $('joinBtn').click(); };
  }
  if (lsGet('vc.transcript') || lsGet('vc.summary')) {
    $('lastWrap').classList.remove('hidden');
    var vb = $('viewLastBtn'); vb.classList.remove('hidden'); vb.onclick = openSaved;
  }
})();
